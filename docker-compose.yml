services:
  wer-api:
    build: .
    ports:
      - "${PORT:-10000}:10000"
    env_file:
      - .env
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      ALIGNMENT_STRATEGY: ${ALIGNMENT_STRATEGY:-span_merge}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
